stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"


build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'


deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d | tr -d '\r' | ssh-add -
    - echo "HOST=$SERVER_HOST PORT=$SERVER_PORT"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p $SERVER_PORT $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
        export CI_REGISTRY=$CI_REGISTRY
        export DOCKER_USERNAME=$CI_REGISTRY_USER
        export DOCKER_PASSWORD=$CI_REGISTRY_PASSWORD
        export IMAGE_TAG=$CI_COMMIT_REF_SLUG
        cd /root/cos360
        ./scripts/deploy.sh
      "
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
  environment:
    name: production
    url: http://103.154.233.187:8000
