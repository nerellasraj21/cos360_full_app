# SESSION_CONTEXT_STRUCTURED.yml
# CANONICAL SOURCE OF TRUTH for COS360 feature implementation tracking
# 
# PURPOSE: Machine-readable feature definitions, endpoints, dependencies, and status
# USAGE: Primary reference for agents, testing automation, and development planning
# AGENT RULE: Read feature status as string only (design|in_progress|done|deprecated)
# 
# Version: 2025-09-13
# Last Updated: 2025-09-13
# Owner: COS360 Development Team
# 
# CRITICAL: This file drives all automation - maintain accuracy and completeness

schema_version: 1.0
project_context:
  name: "COS360"
  version: "Phase 1 Complete + Masters Module"
  last_updated: "2025-09-13"

# Agent Instructions: Status Field Format
status_format:
  canonical_status: "string value only (design|in_progress|done|deprecated)"
  status_metadata: "optional object with detailed breakdown"
  agent_rule: "Always read 'status' field first, ignore nested objects"
  examples:
    correct: 'status: "done"'
    incorrect: 'status: { phase: "complete", implementation_status: "complete" }'
  
environments:
  development:
    database_schema: "cos360_main"
    base_url: "http://localhost:8003"
    migration_revision: "08bbd1b72f43"
  testing:
    database_schema: "test_tenant_schema"
    base_url: "http://localhost:8003"
    test_tenant: "test_tenant"
    tenant_header: "cschema"
    migration_revision: "08bbd1b72f43"

