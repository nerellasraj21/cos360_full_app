[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -p no:cacheprovider
markers =
    unit: phase 1 unit test, no database and no network
    api: phase 2 API test against the local QA tenant
    integration: legacy integration tests that use a live database
    tc(id): documented test case ID from docs/features, for example TC-FEE-03-U01
