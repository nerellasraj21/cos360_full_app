version: "3.3"

services:
  web:
    image: ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    network_mode: host
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL on the deploy host}
      TENANT_DEFAULT_NAME: "little bunny"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
