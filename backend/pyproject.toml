[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "migrations/",
    "venv/",
    ".venv/",
    "scripts/",          # seed/onboarding scripts are allowed to be loose
    "test_scripts/",     # ad-hoc DB inspection scripts
    "__pycache__",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import order)
    "UP",   # pyupgrade (modernise syntax for py311)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print (no stray print() in production code)
]
ignore = [
    "E501",   # line too long — black handles this
    "B008",   # do not perform function calls in default arguments (FastAPI Depends)
    "B904",   # raise from inside except — too strict for FastAPI error handling
    "UP007",  # use X | Y for union types — keep Optional for Pydantic v1 compat
    "T201",   # print found — allowed in scripts and health endpoints
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201", "F401", "E402"]   # tests can print, have unused imports, late imports
"app/api/v1/auth/seed_endpoints.py" = ["T201"]
"app/api/v1/auth/test_*.py" = ["F401", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true


[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
/(
    migrations
  | venv
  | \.venv
  | __pycache__
  | test_scripts
)/
'''


[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: requires live database (Neon)",
    "unit: no external dependencies",
    "error_handling: error handling infrastructure tests",
    "async_test: async test functions",
]
# Show slowest 10 tests
addopts = "--tb=short -q"


[tool.coverage.run]
source = ["app"]
omit = [
    "app/api/v1/auth/test_*.py",
    "app/api/v1/auth/test_setup_endpoints.py",
    "app/api/v1/auth/fix_permissions_endpoints.py",
    "migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
